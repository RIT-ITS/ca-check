replicaCount: 2

# Rolling updates start a new pod and wait for it to be ready before stopping an
# old one. A stopping pod fails /readyz, keeps serving for config.shutdownDelay
# while the ingress stops sending it traffic, then finishes the checks it is
# running before it exits.
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0
minReadySeconds: 5
# Must be more than config.shutdownDelay + the longest check + 5s. The longest
# check is 4 x dialTimeout + 3 x handshakeTimeout + 2 x revocationTimeout + 5s
# (50s with the defaults), so 5 + 50 + 5 = 60s; 75s leaves a margin.
terminationGracePeriodSeconds: 75

image:
  repository: ghcr.io/example/ca-chain-check
  tag: ""            # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

podAnnotations: {}
podLabels: {}

service:
  type: ClusterIP
  port: 80

# Standard Kubernetes Ingress.
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chain-check.example.com
      paths: ["/"]
  tls: []
  #  - secretName: chain-check-tls
  #    hosts: [chain-check.example.com]

# Traefik CRDs (traefik.io/v1alpha1). Use instead of, or alongside, `ingress`.
traefik:
  ingressRoute:
    enabled: false
    entryPoints: [websecure]
    host: chain-check.example.com
    annotations: {}
    tls:
      enabled: true
      # Traefik ACME resolver name, or leave empty and use one of the options below.
      certResolver: ""
      # cert-manager ClusterIssuer (e.g. letsencrypt-prod): creates a Certificate for
      # `host` and serves it from secretName (default <fullname>-tls).
      clusterIssuer: ""
      secretName: ""
  # Edge rate limit (second layer; the app also limits per client IP).
  middleware:
    enabled: false
    average: 120
    burst: 60
    period: 1m
    # Group by this request header instead of the client IP (e.g. CF-Connecting-IP).
    sourceHeader: ""

# Application configuration -> ConfigMap -> environment.
config:
  # Per-client-IP token bucket (per replica). Each check costs 1 + 1 per 4 target IPs.
  rateLimitRPM: 10
  rateLimitBurst: 5
  maxConcurrentProbes: 20
  # CIDRs whose X-Forwarded-For is trusted: set to your ingress controller pod CIDR.
  trustedProxies: "10.0.0.0/8"
  # Header with the real client IP, honored only from trustedProxies (e.g. CF-Connecting-IP).
  clientIPHeader: ""

  # Never testable, by anyone. Add the Kubernetes API service IP etc.
  targetDenyCIDRs: "0.0.0.0/8,169.254.0.0/16,224.0.0.0/4,240.0.0.0/4,255.255.255.255/32,::/128,ff00::/8,fe80::/10,fd00:ec2::254/128"
  # Client CIDRs allowed to test private targets. Empty = nobody.
  privateTargetClientCIDRs: ""
  privateTargetExtraCIDRs: ""

  allowRequestIPOverride: true
  ipOverrideClientCIDRs: ""
  # Custom resolvers, e.g. "10.96.0.10:53" (kube-dns). Empty = pod resolver.
  dnsServers: ""
  maxIPsPerHost: 16
  # Test IPv4 only (no AAAA lookups; IPv6 targets refused).
  disableIPv6: false
  allowedPorts: ""

  # How long a stopping pod keeps accepting requests while the ingress removes it.
  shutdownDelay: 5s
  dialTimeout: 5s
  handshakeTimeout: 5s
  # OCSP and CRL checks for the best path. Needs egress to ports 80 and 443
  # (add 80 to networkPolicy.egressPorts if the NetworkPolicy is on).
  checkRevocation: true
  # Second handshake per IP to find a server's other (RSA or ECDSA) certificate.
  checkAltKeyType: true
  revocationTimeout: 5s
  expiringSoonDays: 30

  mozillaRootsURL: "https://ccadb.my.salesforce-sites.com/mozilla/IncludedRootsPEMTxt?TrustBitsInclude=Websites"
  ccadbStoresURL: "https://ccadb.my.salesforce-sites.com/ccadb/AllIncludedRootCertsCSV"
  microsoftRootsURL: "https://ccadb.my.salesforce-sites.com/microsoft/IncludedCACertificateReportForMSFTCSVPEM"
  # Root programs that must all trust the chain for the trust check to pass.
  requiredTrustStores: "apple,chrome,microsoft,mozilla"
  truststoreRefresh: 24h

# Static DNS overrides so servers in a cluster can be targeted directly.
#   api.internal: ["10.0.0.5", "10.0.0.6"]
#   "*.svc.cluster.local": ["10.96.0.10"]
dnsOverrides: {}

# CA certificates pending loss of trust (SHA-256 fingerprint, colons optional).
pendingDistrust: []
#  - fingerprint: "AB:CD:...:EF"
#    date: "2027-01-15"
#    note: "Example CA losing browser trust for TLS"

# Colour theme overrides (hex). Empty keeps the shared default palette.
# Token names are listed in README ("Theming"); "dark" holds dark-mode values.
theme: {}
#  accent: "#0b6e4f"
#  accent-hover: "#0f8a63"
#  bar: "#102a20"
#  bar-edge: "#c9a227"
#  dark:
#    bar: "#08160f"

extraEnv: []

resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { memory: 256Mi }

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile: { type: RuntimeDefault }

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: { drop: [ALL] }

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Restrict egress to DNS + TLS ports; ingress only from the ingress controller namespace.
networkPolicy:
  enabled: false
  ingressNamespaceSelector:
    kubernetes.io/metadata.name: traefik
  egressPorts: [443]   # target ports users may test; add 8443, or STARTTLS ports (21 25 110 143 389 587 3306 5432), as needed
  dnsPort: 53

nodeSelector: {}
tolerations: []
affinity: {}
