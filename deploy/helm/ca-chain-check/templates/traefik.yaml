{{- $t := .Values.traefik }}
{{- if $t.middleware.enabled }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "ccc.fullname" . }}-ratelimit
  labels: {{- include "ccc.labels" . | nindent 4 }}
spec:
  rateLimit:
    average: {{ $t.middleware.average }}
    burst: {{ $t.middleware.burst }}
    period: {{ $t.middleware.period }}
---
{{- end }}
{{- if $t.ingressRoute.enabled }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ include "ccc.fullname" . }}
  labels: {{- include "ccc.labels" . | nindent 4 }}
spec:
  entryPoints: {{- toYaml $t.ingressRoute.entryPoints | nindent 4 }}
  routes:
    - match: Host(`{{ $t.ingressRoute.host }}`)
      kind: Rule
      {{- if $t.middleware.enabled }}
      middlewares:
        - name: {{ include "ccc.fullname" . }}-ratelimit
      {{- end }}
      services:
        - name: {{ include "ccc.fullname" . }}
          port: {{ .Values.service.port }}
  {{- if $t.ingressRoute.tls.enabled }}
  tls:
    {{- with $t.ingressRoute.tls.certResolver }}
    certResolver: {{ . }}
    {{- end }}
    {{- with $t.ingressRoute.tls.secretName }}
    secretName: {{ . }}
    {{- end }}
  {{- end }}
{{- end }}
