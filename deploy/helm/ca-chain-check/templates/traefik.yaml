{{- $t := .Values.traefik }}
{{- if $t.middleware.enabled }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "ccc.fullname" . }}-ratelimit
  labels: {{- include "ccc.labels" . | nindent 4 }}
spec:
  rateLimit:
    average: {{ $t.middleware.average }}
    burst: {{ $t.middleware.burst }}
    period: {{ $t.middleware.period }}
    {{- with $t.middleware.sourceHeader }}
    sourceCriterion:
      requestHeaderName: {{ . }}
    {{- end }}
---
{{- end }}
{{- if $t.ingressRoute.enabled }}
{{- $tls := $t.ingressRoute.tls }}
{{- $issuer := $tls.clusterIssuer | default "" }}
{{- $secret := $tls.secretName | default (ternary (printf "%s-tls" (include "ccc.fullname" .)) "" (ne $issuer "")) }}
{{- if and $tls.enabled $issuer }}
# cert-manager does not watch IngressRoutes, so request the certificate directly.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "ccc.fullname" . }}
  labels: {{- include "ccc.labels" . | nindent 4 }}
spec:
  secretName: {{ $secret }}
  dnsNames:
    - {{ $t.ingressRoute.host | quote }}
  issuerRef:
    kind: ClusterIssuer
    name: {{ $issuer }}
---
{{- end }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ include "ccc.fullname" . }}
  labels: {{- include "ccc.labels" . | nindent 4 }}
  {{- with $t.ingressRoute.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  entryPoints: {{- toYaml $t.ingressRoute.entryPoints | nindent 4 }}
  routes:
    - match: Host(`{{ $t.ingressRoute.host }}`)
      kind: Rule
      {{- if $t.middleware.enabled }}
      middlewares:
        - name: {{ include "ccc.fullname" . }}-ratelimit
      {{- end }}
      services:
        - name: {{ include "ccc.fullname" . }}
          port: {{ .Values.service.port }}
  {{- if $tls.enabled }}
  tls:
    {{- with $tls.certResolver }}
    certResolver: {{ . }}
    {{- end }}
    {{- with $secret }}
    secretName: {{ . }}
    {{- end }}
  {{- end }}
{{- end }}
