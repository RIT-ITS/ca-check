{{- if .Values.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "ccc.fullname" . }}
  labels: {{- include "ccc.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "ccc.fullname" . }}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }}
---
{{- end }}
{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "ccc.fullname" . }}
  labels: {{- include "ccc.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels: {{- include "ccc.selectorLabels" . | nindent 6 }}
---
{{- end }}
{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ccc.fullname" . }}
  labels: {{- include "ccc.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "ccc.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {{- toYaml .Values.networkPolicy.ingressNamespaceSelector | nindent 14 }}
      ports:
        - port: 8080
          protocol: TCP
  egress:
    - ports:
        - { port: {{ .Values.networkPolicy.dnsPort }}, protocol: UDP }
        - { port: {{ .Values.networkPolicy.dnsPort }}, protocol: TCP }
    - ports:
        {{- range .Values.networkPolicy.egressPorts }}
        - { port: {{ . }}, protocol: TCP }
        {{- end }}
{{- end }}
