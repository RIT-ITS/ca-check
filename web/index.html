<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CA Chain Check</title>
  <meta name="description" content="Check the TLS certificate chain a server sends: trust, order, expiry, extra certificates and pending distrust.">
  <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preload" href="fonts/plex/ibm-plex-sans-latin-400-normal.woff2?v=1" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="theme.css">
  <!-- The diagram library (vendor/mermaid.min.js) loads on the first check. -->
  <script src="app.js" data-mermaid="vendor/mermaid.min.js" defer></script>
</head>
<body>
  <a class="skip" href="#report">Skip to report</a>
  <header class="bar">
    <div class="wrap bar-inner">
      <div class="brand">
        <a class="brand-name" href="./" aria-current="page">CA Chain Check</a>
        <span class="brand-sub">Check a server's TLS certificate chain</span>
        <nav class="bar-links" aria-label="Documentation">
          <a href="help">API help</a>
          <a href="swagger">API reference</a>
        </nav>
      </div>
      <form id="check-form" class="probe" autocomplete="off" novalidate>
        <div class="probe-row">
          <label class="field host">
            <span>Host</span>
            <input id="host" name="host" type="text" inputmode="url" placeholder="www.example.edu" required spellcheck="false" autocapitalize="off" aria-describedby="form-error">
          </label>
          <label class="field port">
            <span>Port</span>
            <input id="port" name="port" type="number" min="1" max="65535" value="443" required>
          </label>
          <button id="submit" class="btn-primary" type="submit">Check chain</button>
        </div>
        <details id="advanced" class="advanced" hidden>
          <summary>Connect to specific IPs</summary>
          <label class="field">
            <span>IP addresses, comma separated. DNS is skipped and the hostname is still sent as SNI.</span>
            <input id="connect-ips" type="text" placeholder="10.0.0.5, 10.0.0.6" spellcheck="false">
          </label>
        </details>
        <p id="form-error" class="form-error" role="alert" hidden></p>
      </form>
    </div>
  </header>

  <main id="report" class="wrap" tabindex="-1">
    <section id="results"></section>
    <div id="announce" class="sr" role="status" aria-live="polite" aria-atomic="true"></div>
  </main>

  <footer class="wrap foot">
    <span id="store-info">Loading trust store…</span>
  </footer>
</body>
</html>
